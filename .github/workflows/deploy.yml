name: Deploy Project Lodestone App
on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  LODESTONE_UTILITIES_BUILD_TESTS: OFF
  THREADING_TYPE: NONE
  BUILD_SHARED_LIBS: OFF
  BIO_TESTS: OFF
  ZLIB_BUILD_STATIC: ON
  ZLIB_BUILD_SHARED: OFF
  MZ_PPMD: OFF
  QT_WASM_ROOT: ${{ github.workspace }}/Qt/6.12.0/wasm_singlethread

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, 'ci:') ||
        contains(github.event.head_commit.message, 'deploy:')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.5
          emsdk-version: 5.0.5
          actions-cache-folder: 'emsdk-cache'

      - name: Check Emscripten
        run: emcc --version

      - name: Setup Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
            dir: ${{ github.workspace }}
            version: '6.12.0'
            host: linux
            target: desktop
            arch: linux_gcc_64
            cache: true

      - name: Setup Qt (WASM)
        uses: jurplel/install-qt-action@v4
        with:
          dir: ${{ github.workspace }}
          version: '6.12.0'
          host: all_os
          target: wasm
          arch: wasm_singlethread
          set-env: false
          cache: true

      - name: Fix Qt WASM permissions
        run: |
          chmod +x "$QT_WASM_ROOT"/bin/* || true
          chmod +x "$QT_WASM_ROOT"/libexec/* || true

      - name: Configure CMake
        run: |
          "$QT_WASM_ROOT/bin/qt-cmake" --preset qt-wasm-static-release -B build \
            -S . \
            -DQT_HOST_PATH="${{ github.workspace }}/Qt/6.12.0/gcc_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_PREFIX_PATH="$QT_WASM_ROOT" \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-s USE_ZLIB=1" \
            -DCMAKE_CXX_FLAGS="-s USE_ZLIB=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-s USE_ZLIB=1"

      - name: Build
        run: |
          cmake --build build --config Release --preset qt-wasm-static-release --parallel

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages
        run: |
          mkdir -p pages
          cp build/Lodestone.html pages/index.html
          cp build/Lodestone.js pages/
          cp build/Lodestone.wasm pages/
          cp build/qtloader.js pages/
          cp build/qtlogo.svg pages/
          [ -f build/Lodestone.data ] && cp build/Lodestone.data pages/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4