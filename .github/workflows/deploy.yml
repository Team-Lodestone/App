name: Deploy Project Lodestone App
on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  LODESTONE_UTILITIES_BUILD_TESTS: OFF
  THREADING_TYPE: NONE
  BUILD_SHARED_LIBS: OFF
  BIO_TESTS: OFF
  ZLIB_BUILD_STATIC: ON
  ZLIB_BUILD_SHARED: OFF
  MZ_PPMD: OFF
  QT_WASM_ROOT: /home/runner/Qt/6.12.0-wasm

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.5
          emsdk-version: 5.0.5
          actions-cache-folder: 'emsdk-cache'

      - name: Check Emscripten
        run: emcc --version

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.12.0
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Verify host Qt
        shell: bash
        run: |
          set -euxo pipefail

          echo "QT_ROOT_DIR=${QT_ROOT_DIR:-unset}"
          echo "Qt6_DIR=${Qt6_DIR:-unset}"

          QT_HOST_PATH="/home/runner/Qt/6.12.0/gcc_64"

          test -d "$QT_HOST_PATH"
          test -f "$QT_HOST_PATH/lib/cmake/Qt6/Qt6Config.cmake"
          test -x "$QT_HOST_PATH/bin/moc"
          test -x "$QT_HOST_PATH/bin/rcc"

          echo "Host Qt installation verified."

      - name: Build Qt from source (WASM-shared)
        shell: bash
        run: |
          set -euo pipefail
          
          QT_VERSION=6.12.0
          QT_SOURCE="$RUNNER_TEMP/qt-everywhere-src-$QT_VERSION"
          
          wget -q "https://download.qt.io/official_releases/qt/6.12/$QT_VERSION/single/qt-everywhere-src-$QT_VERSION.tar.xz" \
            -O "$RUNNER_TEMP/qt-everywhere-src-$QT_VERSION.tar.xz"
          
          mkdir -p "$QT_SOURCE"
          tar -xf "$RUNNER_TEMP/qt-everywhere-src-$QT_VERSION.tar.xz" \
            -C "$RUNNER_TEMP"
          
          mkdir -p "$QT_WASM_ROOT"
          cd "$QT_SOURCE"
          
          emcmake ./configure \
            -qt-host-path "/home/runner/Qt/6.12.0/gcc_64" \
            -platform wasm-emscripten \
            -prefix "$QT_WASM_ROOT" \
            -opensource \
            -confirm-license \
            -feature-thread \
            -submodules qtbase \
            -nomake examples \
            -nomake tests
          
          cmake --build . --parallel
          cmake --install .

      - name: Check Qt
        run: |
          which emcc
          emcc --version
          which qt-cmake || true
          echo "Qt6_DIR=$Qt6_DIR"

      - name: Configure CMake
        run: |
          emcmake cmake --preset qt-wasm-static-release -B build \
            -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_PREFIX_PATH="$QT_WASM_ROOT" \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-s USE_ZLIB=1" \
            -DCMAKE_CXX_FLAGS="-s USE_ZLIB=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-s USE_ZLIB=1"

      - name: Build
        run: |
          cmake --build build --config Release --preset qt-wasm-static-release --parallel

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages
        run: |
          mkdir -p pages
          cp build/Lodestone.html pages/index.html
          cp build/Lodestone.js pages/
          cp build/Lodestone.wasm pages/
          cp build/qtloader.js pages/
          cp build/qtlogo.svg pages/
          cp build/Lodestone.data pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4